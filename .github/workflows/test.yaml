name: test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: go test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Newest 1.26 patch, not go.mod's minimum. See lint.yaml.
          go-version: '1.26.x'
          check-latest: true

      # The same commands run on all three OSes. -race needs cgo, which the
      # runners provide.
      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -cover ./...
